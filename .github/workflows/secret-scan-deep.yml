name: Secret scan (deep, verified)

# Weekly full-history secret scan with credential verification.
# Complements the per-PR gitleaks job in ci.yml:
#   - gitleaks (MIT)         runs on every PR and push: fast, regex-based, blocking.
#   - TruffleHog (AGPL-3.0)  runs weekly on full history with --only-verified:
#                            confirms whether a found credential is actually live.
#
# SELF-CONTAINED BY NECESSITY, NOT PREFERENCE.
# This job previously delegated to a reusable workflow in a private sibling
# repository. That can never run here: GitHub does not allow a PUBLIC
# repository to consume a reusable workflow from a PRIVATE one, whatever the
# organization-level Actions access setting says. Every scheduled run failed
# at workflow resolution -- zero jobs started, so there were no step logs to
# read and nothing that looked like a scan error. The job simply reported
# failure each week while appearing, from its name and schedule, to be
# providing coverage.
#
# That is the worst place in this project to have a control that only looks
# present: memforge publishes to a public package index, so both the git
# history and the released artifact are irrevocable once shipped.
#
# Inlining the step removes the cross-visibility dependency entirely. The
# action is SHA-pinned rather than tag-pinned because a tag can move and a
# commit cannot.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-deep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trufflehog:
    name: TruffleHog full-history verified scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3.96.0
        with:
          path: ./
          base: ""
          head: HEAD
          # KEEP THIS LINE EXACTLY AS IS -- pass ONLY --only-verified.
          #
          # The action's own template already supplies --no-update AND --fail.
          # The CLI rejects any repeated flag ("flag '<name>' cannot be
          # repeated"), and it does so BEFORE scanning, so the run fails
          # having examined nothing while still looking like a scan that ran.
          #
          # Both duplicates have now been hit for real in this project:
          # --no-update silently broke this scan across six sibling
          # repositories for months, and --fail broke it here on the very
          # commit that was fixing --no-update. Adding a flag "to be explicit"
          # is the trap; the template is already explicit.
          #
          # Fail-on-findings is therefore ALREADY ACTIVE and is not something
          # this file needs to request. That matters: this package is public,
          # so a live credential in history is disclosed the moment it lands.
          extra_args: --only-verified
