name: Release to PyPI

on:
  push:
    tags:
      # Release tags only (v<digit>...). Publish is gated by FIVE in-repo
      # controls: this tag filter; the "Tag is signed and on main" step (a tag
      # on a commit that never merged to main, or an unsigned or lightweight
      # tag, fails before anything is built); the `test` job (pytest +
      # version-consistency
      # run against the exact tag commit, since ci.yml never sees a tag ref);
      # the "Verify pyproject version matches tag" step (a mismatched tag fails
      # before build); and the `pypi` deployment environment on the publish job
      # (configure required-reviewer protection rules on the environment in
      # GitHub settings so a tag push alone cannot publish). Trusted publishing
      # (OIDC) means no long-lived token is stored.
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test gate (pytest + version consistency)
    runs-on: ubuntu-latest
    outputs:
      tag_object: ${{ steps.tag_check.outputs.tag_object }}
    # A tag ref does NOT trigger ci.yml (it runs only on push/PR to main), so
    # the tag commit that actually publishes has never been tested by CI. This
    # job re-runs the test suite and the version-consistency assertion against
    # the exact tag commit, and build/publish `needs:` it. Do not remove: a
    # green CI run on main earlier is not a guarantee the tag commit is sound.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag is signed and on main
        id: tag_check
        # Anyone who can push a tag can start this workflow. Only a signed,
        # annotated tag on a commit that reached main through review may go
        # on to build and publish. The values come in through env, never
        # through expression text in the script.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT" FETCH_HEAD; then
            echo "::error::tag $TAG points at $COMMIT, which is not on main"
            exit 1
          fi
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" != "tag" ]; then
            echo "::error::tag $TAG is not an annotated tag (found ${ref%% *})"
            exit 1
          fi
          tag_json=$(gh api "repos/$REPO/git/tags/${ref##* }")
          # The tag ref is read now, after the push that started this run. It
          # must still name the commit this run checked out and tested.
          target=$(jq -r '.object.type + " " + .object.sha' <<<"$tag_json")
          if [ "$target" != "commit $COMMIT" ]; then
            echo "::error::tag $TAG now points at ${target}, not the commit $COMMIT this run is building"
            exit 1
          fi
          verified=$(jq -r '.verification.verified' <<<"$tag_json")
          if [ "$verified" != "true" ]; then
            echo "::error::tag $TAG has no signature GitHub can verify"
            exit 1
          fi
          # The release step later requires the tag to still name this same
          # tag object, so a tag replaced in between is caught there.
          echo "tag_object=${ref##* }" >> "$GITHUB_OUTPUT"
          echo "OK: $TAG is a verified signed tag on a commit that is on main"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,dlp]'
      - name: Run pytest
        run: pytest -q
      - name: Assert __version__, installed metadata, and CHANGELOG agree
        shell: bash
        run: |
          meta=$(python -c "from importlib.metadata import version; print(version('ildan-memforge'))")
          attr=$(python -c "import memforge; print(memforge.__version__)")
          echo "metadata=$meta  __version__=$attr"
          if [ "$meta" != "$attr" ]; then
            echo "::error::memforge.__version__ ($attr) != installed metadata ($meta)"
            exit 1
          fi
          if ! grep -qE "^## \[$meta\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$meta]' heading for the shipping version"
            exit 1
          fi
          echo "OK: version $meta consistent across metadata, __version__, and CHANGELOG"

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install build backend
        run: pip install 'build==1.2.2'
      - name: Verify pyproject version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c 'import tomllib,sys; print(tomllib.loads(open("pyproject.toml","rb").read().decode())["project"]["version"])')
          echo "tag=${tag}  pkg=${pkg}"
          if [ "${tag}" != "${pkg}" ]; then
            echo "ERROR: tag '${tag}' does not match pyproject version '${pkg}'"
            exit 1
          fi
      - name: Build distributions
        run: python -m build
      - name: Inspect dist
        run: ls -la dist/
      - name: Generate CycloneDX SBOM from the built wheel
        shell: bash
        run: |
          # SBOM is generated from a clean env containing ONLY the built wheel +
          # its runtime deps, so it reflects the shipped artifact's real
          # dependency tree (not the build toolchain). Written to a SEPARATE
          # sbom/ dir so the PyPI publish job uploads only the sdist + wheel.
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p sbom
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --quiet --upgrade pip
          /tmp/sbomenv/bin/pip install --quiet dist/*.whl
          pip install --quiet 'cyclonedx-bom==7.3.0'
          cyclonedx-py environment /tmp/sbomenv --of JSON -o "sbom/ildan-memforge-${ver}.cdx.json" --validate
          ls -la sbom/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # OIDC trusted publishing: PyPI verifies the OIDC token issued by GitHub
    # Actions and matches it against the Trusted Publisher binding configured
    # on the PyPI project. No long-lived API token is stored in repo secrets.
    # Setup (one-time, on PyPI side):
    #   https://pypi.org/manage/project/ildan-memforge/settings/publishing/
    #     -> Add a new publisher with:
    #          owner: ildan-ai
    #          repository: memforge
    #          workflow: release.yml
    #          environment: pypi
    environment:
      name: pypi
      url: https://pypi.org/project/ildan-memforge/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # skip-existing makes an idempotent re-run of the SAME good build safe
      # (re-running this workflow on an already-published version is a no-op
      # rather than a hard error). It is NOT a re-tag escape hatch: PyPI forbids
      # overwriting a published filename, so if a defect is found AFTER publish,
      # the fix MUST ship as a NEW patch version (e.g. 0.6.2), never the same
      # version re-tagged. Re-tagging the same version after a content change
      # would skip silently here and leave the broken first upload live.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  pdf:
    name: Build architecture PDF
    needs: test
    runs-on: ubuntu-latest
    # The PDF is built here from the tag commit, never on a laptop, so a
    # reader can check it against the attestation and the release notes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Chrome prints files from this checkout; leave no token in it.
          persist-credentials: false
      - name: Load the pinned PDF toolchain
        # Versions and the pandoc checksum live in docs/pdf/toolchain.conf, which
        # build-pdf.sh also reads; it refuses any other version.
        shell: bash
        run: |
          set -euo pipefail
          pins=$(grep -E '^(PANDOC_VERSION|PANDOC_LINUX_AMD64_SHA256|CHROME_VERSION)=[A-Za-z0-9.]+$' docs/pdf/toolchain.conf)
          if [ "$(printf '%s\n' "$pins" | wc -l)" -ne 3 ]; then
            echo "::error::docs/pdf/toolchain.conf must set PANDOC_VERSION, PANDOC_LINUX_AMD64_SHA256 and CHROME_VERSION once each"
            exit 1
          fi
          printf '%s\n' "$pins" | tee -a "$GITHUB_ENV"
      - name: Install pandoc (pinned, sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          archive="pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          curl -sSfL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${archive}" -o "$RUNNER_TEMP/$archive"
          echo "${PANDOC_LINUX_AMD64_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "PANDOC=$RUNNER_TEMP/pandoc-${PANDOC_VERSION}/bin/pandoc" >> "$GITHUB_ENV"
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-dependencies: true
      - name: Let Chrome start its sandbox
        # Ubuntu 23.10 and later block unprivileged user namespaces through
        # AppArmor, and Chrome's sandbox needs one. This runner is a throwaway
        # VM that runs only this job, so the restriction is lifted here and
        # Chrome keeps its sandbox.
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build the PDF
        # build-pdf.sh prints the pandoc and Chrome versions it checked.
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p pdf
          docs/pdf/build-pdf.sh "pdf/memforge-${GITHUB_REF_NAME#v}-architecture.pdf"
          ls -la pdf/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pdf
          path: pdf/
          if-no-files-found: error

  attest:
    name: Attest build provenance (dist, SBOM, PDF)
    needs: [build, pdf]
    runs-on: ubuntu-latest
    # The only job that can sign an attestation. One provenance attestation,
    # signed through Sigstore with this run's OIDC identity, covers every file
    # the GitHub Release attaches.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom
          path: sbom/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pdf
          path: pdf/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*
            pdf/*

  github-release:
    name: GitHub Release (dist, CycloneDX SBOM, architecture PDF)
    needs: [test, build, publish, pdf, attest]
    runs-on: ubuntu-latest
    # Every release ships a CycloneDX SBOM and the architecture PDF alongside
    # the sdist + wheel (signed source release rule). The tag itself is signed
    # at creation time (SSH, GitHub-verified); this job attaches the build
    # artifacts, SBOM and PDF to the GitHub Release and lists their sha256.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom
          path: sbom/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pdf
          path: pdf/
      - name: Create GitHub Release with dist, SBOM and PDF
        # The tag was checked in the test job, but build and publish run in
        # between and the tag can be moved or replaced meanwhile. Read it again
        # right before the release names it, and only release if it is still
        # the same signed tag object the test job verified (a tag object's sha
        # covers its signature and its target) and points at the commit this
        # run built. --verify-tag stops gh from creating a tag when none exists.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          TAG_OBJECT: ${{ needs.test.outputs.tag_object }}
        run: |
          set -euo pipefail
          if [ -z "$TAG_OBJECT" ]; then
            echo "::error::the test job did not record the verified tag object"
            exit 1
          fi
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "$ref" != "tag $TAG_OBJECT" ]; then
            echo "::error::tag $TAG now names ${ref}, not the signed tag object $TAG_OBJECT the test job verified"
            exit 1
          fi
          target=$(gh api "repos/$REPO/git/tags/$TAG_OBJECT" --jq '.object.type + " " + .object.sha')
          if [ "$target" != "commit $COMMIT" ]; then
            echo "::error::tag $TAG now points at ${target}, not the commit $COMMIT this run built and published"
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "MemForge $TAG. See CHANGELOG.md for the release notes. A CycloneDX SBOM (ildan-memforge-*.cdx.json) and the architecture PDF, built from the tagged sources, are attached alongside the sdist and wheel. The release tag is signed and GitHub-verified."
            echo
            echo "Every attached file has a build provenance attestation from this workflow. Check a download with \`gh attestation verify <file> --repo $REPO\` and compare its sha256 with this list:"
            echo
            echo '```'
            for f in dist/* sbom/* pdf/*; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d ' ' -f 1)" "${f##*/}"
            done
            echo '```'
          } > "$notes"
          cat "$notes"
          gh release create "$TAG" dist/* sbom/* pdf/* \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$notes"
